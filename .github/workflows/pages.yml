name: Deploy dashboard

# Publishes dashboard/ (index.html + data.json) to GitHub Pages.
# Enable it once: Settings → Pages → Source → "GitHub Actions".

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r dashboard/. _site/ 2>/dev/null || true
          if [ ! -f _site/index.html ]; then
            echo "dashboard/ has not been generated yet — run the Auto Update workflow first."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
