name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest -q --maxfail=1

      - name: Smoke test (offline fixtures)
        run: |
          mkdir -p /tmp/popvpn-run && cp links.txt README.md /tmp/popvpn-run/
          cd /tmp/popvpn-run
          python "$GITHUB_WORKSPACE/main.py" --config "$GITHUB_WORKSPACE/config.yaml" \
            --offline "$GITHUB_WORKSPACE/tests/data" --no-notify --quiet
          python "$GITHUB_WORKSPACE/scripts/verify_outputs.py"

  # Real end-to-end run against the live sources listed in links.txt.
  # Writes into a scratch directory so the repository is never touched.
  pipeline:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Full run against live sources
        run: |
          python -m pip install --quiet pyyaml
          mkdir -p /tmp/live && cp links.txt README.md /tmp/live/
          cd /tmp/live
          python "$GITHUB_WORKSPACE/main.py" --config "$GITHUB_WORKSPACE/config.yaml" \
            --limit 3000 --no-notify
          python "$GITHUB_WORKSPACE/scripts/verify_outputs.py"
          {
            echo "### Live pipeline run"
            echo '```json'
            python - <<'PY'
          import json
          stats = json.load(open("outputs/stats.json"))
          keep = ("generated_at","total","unique","parsed","duplicates","invalid","by_protocol","sources","country_count","duration_ms")
          print(json.dumps({k: stats.get(k) for k in keep}, indent=2, ensure_ascii=False))
          PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          TOTAL=$(python -c 'import json;print(json.load(open("outputs/stats.json"))["total"])')
          echo "published configs: $TOTAL"
          test "$TOTAL" -gt 0

      - name: Upload live stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stats
          path: /tmp/live/outputs/stats.json
          if-no-files-found: warn
          retention-days: 3
