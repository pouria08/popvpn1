name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest -q --maxfail=1

      - name: Smoke test (offline fixtures)
        run: |
          mkdir -p /tmp/popvpn-run && cp links.txt README.md /tmp/popvpn-run/
          cd /tmp/popvpn-run
          python "$GITHUB_WORKSPACE/main.py" --config "$GITHUB_WORKSPACE/config.yaml" \
            --offline "$GITHUB_WORKSPACE/tests/data" --no-notify --quiet
          python "$GITHUB_WORKSPACE/scripts/verify_outputs.py"

  pipeline:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dry run against live sources
        run: python main.py --dry-run --json --quiet --limit 200
